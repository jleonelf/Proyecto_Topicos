server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aplicación de una sola página: cualquier ruta desconocida vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos compilados con hash en el nombre: se pueden cachear mucho tiempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
