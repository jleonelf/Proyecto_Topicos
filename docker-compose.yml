# Levanta el sistema completo: docker compose up --build
#   Frontend: http://localhost:5173
#   API:      http://localhost:8000/docs
name: asistente-tienda-ropa

services:
  backend:
    build: ./backend
    container_name: asistente-backend
    ports:
      - "8000:8000"
    volumes:
      # Código del backend montado para modificar en vivo y reentrenar sin reconstruir
      - ./backend:/app
      # Datos de entrenamiento y base de datos SQLite de la tienda
      - ./database:/database
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: asistente-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
