# Configuración central del Pipeline de NLP y Modelos ML

project:
  name: "asistente-tienda-ropa"
  version: "1.0.0"
  seed: 42

data:
  raw_path: "data/raw/intenciones.csv"
  test_size: 0.2
  seed: 42
  ood_val_path: "data/ood_val.csv"
  ood_test_path: "data/ood_test.csv"

nlp:
  modo: "lema" # 'lema' (spaCy es_core_news_sm) o 'stem' (Snowball NLTK)
  stopwords_extra:
    - "porfa"
    - "oye"
    - "disculpa"
    - "favor"
  stopwords_exclude:
    - "no"
    - "sin"
    - "mas"
    - "más"

vectorizer:
  ngram_range: [1, 2] # unigramas y bigramas
  min_df: 1
  max_df: 0.95
  max_features: 2000
  sublinear_tf: true

models:
  scoring: "f1_macro"
  cv_folds: 5
  n_jobs: 1 # Procesamiento secuencial para evitar overhead de multiproceso en Windows
  logistic_regression:
    param_grid:
      modelo__C: [0.1, 1.0, 5.0, 10.0]
      modelo__class_weight: [null, "balanced"]
    fixed_params:
      max_iter: 1000
      solver: "lbfgs"
      random_state: 42
  naive_bayes:
    param_grid:
      modelo__alpha: [0.1, 0.5, 1.0, 2.0]
    fixed_params: {}

ood:
  val_path: "data/ood_val.csv"
  test_path: "data/ood_test.csv"
  estrategia: "hybrid_dual_gate"
  umbral_prob: 0.35
  umbral_cobertura: 0.35
  umbral_similitud: 0.0

inference:
  umbral: 0.35 # Umbral base probabilístico
  top_k: 3
  usar_detector_ood: true

artifacts:
  model_path: "artifacts/modelo.joblib"
  metrics_path: "artifacts/metricas.json"
  ood_detector_path: "artifacts/ood_detector.joblib"
