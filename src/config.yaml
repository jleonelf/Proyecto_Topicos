# ==============================================================================
# CONFIGURACIÓN GENERAL DEL SISTEMA - ASISTENTE PARA TIENDAS DE ROPA
# ==============================================================================
# Este archivo centraliza los parámetros de NLP, Machine Learning y Backend.
# Permite modificar hiperparámetros y reglas sin tocar el código fuente,
# facilitando las modificaciones en vivo durante la defensa del proyecto.

proyecto:
  nombre: "Asistente Tiendas de Ropa"
  version: "1.0.0"
  semilla: 42  # Semilla global para reproducibilidad (exigencia del PDF)

# ------------------------------------------------------------------------------
# Rutas de datos y artefactos
# ------------------------------------------------------------------------------
rutas:
  datos_crudos: "data/raw/intenciones.csv"
  tienda_demo: "data/raw/tienda_demo"
  modelo_guardado: "artifacts/modelo.joblib"
  metricas_guardadas: "artifacts/metricas.json"
  base_datos_tienda: "artifacts/tienda.db"

# ------------------------------------------------------------------------------
# Preprocesamiento de Texto (Fases 1 a 4 - Carmen y Fernando)
# ------------------------------------------------------------------------------
preprocesamiento:
  modo: "lema"  # "lema" (spaCy) o "stem" (Snowball NLTK)
  spacy_modelo: "es_core_news_sm"
  normalizacion:
    pasar_a_minusculas: true
    remover_puntuacion: true
    conservar_numeros: true  # Vital para tallas (ej. "32", "38") y precios
    conservar_emojis: false
    remover_urls: true
  stopwords:
    idioma: "spanish"
    # Palabras que NO deben eliminarse porque alteran el sentido o intención
    excluir:
      - "no"
      - "sin"
      - "mas"
      - "más"
      - "poco"
      - "muy"
    # Modismos comunes en chats que se pueden filtrar
    adicionales:
      - "porfa"
      - "oye"
      - "disculpa"
      - "hola"
      - "buenas"

# ------------------------------------------------------------------------------
# Fase 5: Vectorización TF-IDF y N-Gramas (Ramiro)
# ------------------------------------------------------------------------------
vectorizador:
  # Rango de n-gramas: [1, 1] solo unigramas, [1, 2] unigramas + bigramas
  # Bigramas capturan contextos clave como "talla m", "sin stock", "envio gratis"
  ngram_range:
    - 1
    - 2
  min_df: 1         # Frecuencia mínima de documento (ignora palabras hiper-raras/typos únicos)
  max_df: 0.95      # Frecuencia máxima de documento (ignora palabras presentes en > 95% de frases)
  max_features: null  # Vocabulario máximo (null para no limitar o entero ej. 2000)
  sublinear_tf: true  # Aplica escala sublineal: 1 + log(tf) para suavizar términos frecuentes
  norm: "l2"        # Normalización euclidiana de vectores
  use_idf: true     # Activa la ponderación de frecuencia inversa de documento

# ------------------------------------------------------------------------------
# Fase 6: Modelado y Entrenamiento (Jorge)
# ------------------------------------------------------------------------------
modelado:
  modelo_activo: "regresion_logistica"  # "regresion_logistica" o "naive_bayes"
  test_size: 0.2                       # 20% para test estratificado
  cv_splits: 5                         # 5-fold Stratified K-Fold
  regresion_logistica:
    C: 1.0
    solver: "lbfgs"
    max_iter: 1000
    class_weight: "balanced"           # Mitiga desbalance entre intenciones
  naive_bayes:
    tipo: "ComplementNB"               # ComplementNB maneja mejor datos desbalanceados
    alpha: 0.5                         # Suavizado de Laplace

# ------------------------------------------------------------------------------
# Capa Backend: API REST FastAPI (Ramiro)
# ------------------------------------------------------------------------------
api:
  host: "0.0.0.0"
  port: 8000
  # Umbral mínimo de confianza del modelo para aceptar una intención
  # Si probabilidad < umbral_confianza, el chatbot responde "No entendí la consulta"
  umbral_confianza: 0.60
  top_k_predicciones: 3  # Número de intenciones candidatas a retornar
  
  # Validaciones de entrada (Pydantic)
  validacion:
    min_longitud_texto: 3     # Evita textos vacíos o de 1 o 2 letras
    max_longitud_texto: 500   # Evita ataques de denegación de servicio o textos excesivos
    
  # Configuración de CORS para conexión con Frontend (React + Vite)
  cors:
    permitir_origenes:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:3000"
